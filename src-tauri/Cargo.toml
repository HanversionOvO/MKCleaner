[package]
name = "mkcleaner"
version = "0.1.0"
description = "A calm Mac cleanup app, powered by the Mole engine"
authors = ["MkCleaner contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mkcleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
portable-pty = "0.9.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2.3.3"

# Already in the tree via Tauri. App icons live in asset catalogs on modern
# apps, with no .icns to read, so the icon has to come from AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSImage",
    "NSBitmapImageRep",
    "NSImageRep",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSApplication",
    "NSEvent",
    "NSWindow",
    "NSView",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSDictionary", "NSGeometry"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
